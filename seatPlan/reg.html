<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Record API</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
  <div class="card shadow p-4">
    <h2 class="text-center mb-4">Check Student Record</h2>
    
    <div class="mb-3">
      <label for="regNo" class="form-label">Registration Number</label>
      <input type="text" id="regNo" class="form-control" placeholder="Enter Registration No">
    </div>
    
    <button onclick="getStudentRecord()" class="btn btn-primary w-100">Search</button>

    <div class="mt-4">
      <pre id="result" class="bg-dark text-white p-3 rounded"></pre>
    </div>
  </div>
</div>

<script>
async function getStudentRecord() {
  const regNo = document.getElementById("regNo").value.trim();
  if (!regNo) {
    alert("Please enter a registration number");
    return;
  }

  const url = `http://103.113.200.45:8006/api/college/ff/tc-student-record?reg_no=${regNo}&check_condition=false`;

  try {
    const response = await fetch(url, {
      method: "GET",
      headers: {
        "Authorization": "Bearer eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJodHRwOi8vMTAzLjExMy4yMDAuNDY6ODAwNi9hcGkvY29sbGVnZS9sb2dpbiIsImlhdCI6MTc1NjQzMjQ5OSwiZXhwIjoxNzU5MDI0NDk5LCJuYmYiOjE3NTY0MzI0OTksImp0aSI6InBMRVVmaEZ3aXBhSlRsOHIiLCJzdWIiOiIyMDcwIiwicHJ2IjoiNzYwNTliMGE3ZDYxMWU3MmRjODI2Nzg0N2VhZmYxNzUwZmVhZjkyZCJ9.2P9aD_Q4O6nsBIoV0h7w_HC_JTtBz0ZlG_Mz9BdR9Fc",
        "Accept": "application/json"
      }
    });

    if (!response.ok) throw new Error("Failed to fetch data");

    const data = await response.json();
    document.getElementById("result").textContent = JSON.stringify(data, null, 2);
  } catch (err) {
    document.getElementById("result").textContent = "Error: " + err.message;
  }
}
</script>

</body>
</html>
