<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Honours 1st Year 2025 PDF Library</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:Poppins,sans-serif;background:#eef2ff}
</style>
</head>
<body>
<div class="max-w-7xl mx-auto p-6">
<div class="text-center mb-8">
<h1 class="text-4xl font-bold text-indigo-700">📚 Honours 1st Year Examination 2025</h1>
<p class="text-gray-600 mt-2">National University, Bangladesh • Digital PDF Library</p>

<div class="mt-5">
<input id="search" type="text" placeholder="Search subject..."
class="w-full md:w-96 px-5 py-3 rounded-xl border shadow focus:outline-none focus:ring-2 focus:ring-indigo-500">
</div>

<div class="mt-4">
<span class="bg-indigo-600 text-white px-4 py-2 rounded-full">
Total Subjects :
<span id="count"></span>
</span>
</div>
</div>

<div id="list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
</div>

<script>
const pdfs=[
{title:"Bangla (Compulsory)",file:"10-BANGLA-part-1-2201_2025_1101_10_dsp.pdf"},
{title:"English (Compulsory)",file:"11-ENGLISH-2201_2025_1101_11_dsp-part-1.pdf"},
{title:"Sanskrit",file:"13-SANSKRIT-2201_2025_1101_13_dsppart-1.pdf"},
{title:"History",file:"15-HISTORY-part-1-2201_2025_1101_15_ds.pdf"},
{title:"Islamic History & Culture",file:"16-ISLAMIC HISTORY & CULTURE-part-1-2201_2025_1101_16_dsp.pdf"},
{title:"Philosophy",file:"17-PHILOSOPHY-part-1-2201_2025_1101_17_ds.pdf"},
{title:"Islamic Studies",file:"18-ISLAMIC STUDIES-part-1-2201_2025_1101_18_dsp.pdf"},
{title:"Political Science",file:"19-POLITICAL SCIENCE-part-1-2201_2025_1101_19_ds.pdf"},
{title:"Sociology",file:"20-SOCIOLOGY-part-1-2201_2025_1101_20_dsp.pdf"},
{title:"Social Work",file:"21-SOCIAL WORK-part-1-2201_2025_1101_23_dsp.pdf"},
{title:"Economics",file:"22-ECONOMICS-2201_2025_1101_22_dsp.pdf"},
{title:"Marketing",file:"23-MARKTING-honours 1st- 2025 2201_2025_1101_23.pdf"},
{title:"Finance & Banking",file:"24-FINANCE & BANKING-1st year 2025-2201_2025_1101_24_dsp.pdf"},
{title:"Accounting",file:"25-ACCOUNTING-honours 1st year 20252201_2025_1101_25_dsp.pdf"},
{title:"Management",file:"26-MANAGEMENT-2201_2025_1101_26_dsp.pdf"},
{title:"Physics",file:"27-Physics- part12201_2025_1101_27_dsp.pdf"},
{title:"Chemistry",file:"28-Chemistry-2201_2025_1101_28_dsp.part-1.pdf"},
{title:"Botany",file:"30-BOTANY- part-1-2201_2025_1101_30_dsp.pdf"},
{title:"Zoology",file:"31-Zoology-2201_2025_1101_31_dsp-part-1.pdf"},
{title:"Soil Science",file:"33-Soil Science-2201_2025_1101_33_dsp-part-1.pdf"},
{title:"Statistics",file:"36-Statistics-2201_2025_1101_36_dsp-part-1.pdf"},
{title:"Mathematics",file:"37-MATHEMATICS-2201_2025_1101_37_dsp-part-1.pdf"}
];

const container=document.getElementById("list");
const count=document.getElementById("count");

function render(data){
container.innerHTML="";
count.textContent=data.length;

data.forEach(item=>{
container.innerHTML+=`
<div class="bg-white rounded-2xl shadow-lg hover:shadow-2xl transition overflow-hidden">
<div class="bg-gradient-to-r from-indigo-600 to-blue-600 p-5 text-white text-center">
<div class="text-5xl">📄</div>
<h2 class="mt-3 font-bold text-lg">${item.title}</h2>
<p class="text-xs opacity-90">Honours 1st Year Examination 2025</p>
</div>

<div class="p-5">
<div class="flex gap-2">
<a href="${item.file}" target="_blank"
class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white text-center py-2 rounded-lg">Open</a>

<a href="${item.file}" download
class="flex-1 bg-green-600 hover:bg-green-700 text-white text-center py-2 rounded-lg">Download</a>
</div>
</div>
</div>`;
});
}

render(pdfs);

document.getElementById("search").addEventListener("input",function(){
const keyword=this.value.toLowerCase();
render(pdfs.filter(item=>item.title.toLowerCase().includes(keyword)));
});
</script>
</body>
</html>
