<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NU Admit Card Fetcher</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5">
    <h2 class="text-center mb-4">🎓 NU Admit Card Checker</h2>
    
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow p-4">
          <div class="mb-3">
            <label for="admissionRoll" class="form-label">Enter Admission Roll</label>
            <input type="text" class="form-control" id="admissionRoll" placeholder="e.g. 5203330">
          </div>
          <button class="btn btn-primary w-100" onclick="fetchAdmitCard()">Check Admit Card</button>
        </div>
      </div>
    </div>

    <div id="result" class="row justify-content-center mt-4"></div>
  </div>

  <script>
    function fetchAdmitCard() {
      const roll = document.getElementById('admissionRoll').value.trim();
      const resultDiv = document.getElementById('result');


      if (roll === '') {
        alert('Please enter a valid roll number.');
        return;
      }

      const url = `http://app55.nu.edu.bd/nu-web/fetchAdmitCardInformation?admissionRoll=${roll}`;

      fetch(url)
        .then(res => res.json())
        .then(data => {
          if (!data || !data.name) {
            resultDiv.innerHTML = `<div class="alert alert-danger text-center">No data found for Roll: ${roll}</div>`;
            return;
          }

          resultDiv.innerHTML = `
            <div class="col-md-8">
              <div class="card shadow p-4">
                <h5 class="card-title text-primary mb-3">${data.name} — Admit Card</h5>
                <ul class="list-group">
                  <li class="list-group-item"><strong>Roll:</strong> ${roll}</li>
                  <li class="list-group-item"><strong>Reg No:</strong> ${data.regNo}</li>
                  <li class="list-group-item"><strong>Session:</strong> ${data.session}</li>
                  <li class="list-group-item"><strong>College:</strong> ${data.collegeName}</li>
                  <li class="list-group-item"><strong>Course:</strong> ${data.courseTitle}</li>
                </ul>
              </div>
            </div>
          `;
        })
        .catch(err => {
          resultDiv.innerHTML = `<div class="alert alert-danger text-center">Error fetching data.</div>`;
          console.error(err);
        });
    }
  </script>

</body>
</html>
