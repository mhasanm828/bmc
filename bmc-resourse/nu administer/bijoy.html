<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SutonnyMJ Converter</title>
  <link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>

@font-face {
  font-family: 'SutonnyMJ';
  src: url('SutonnyMJ.ttf') format('truetype');
}

body {
  font-family: sans-serif;
  background-color: #f9f9f9;
  padding: 2rem;
}

.container {
  max-width: 600px;
  margin: auto;
  background: white;
  padding: 2rem;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
  border-radius: 8px;
}

textarea {
  width: 100%;
  height: 120px;
  padding: 1rem;
  font-size: 16px;
  border: 1px solid #ddd;
  border-radius: 5px;
  resize: vertical;
}

.preview-box {
  margin-top: 1.5rem;
}

#previewText {
  margin-top: 0.5rem;
  padding: 1rem;
  background: #f1f1f1;
  border: 1px solid #ddd;
  border-radius: 5px;
  font-family: 'SutonnyMJ', sans-serif;
  font-size: 20px;
  white-space: pre-wrap;
}

.buttons {
  margin-top: 1rem;
  display: flex;
  gap: 10px;
}

button {
  padding: 10px 15px;
  background-color: #0066cc;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

button:hover {
  background-color: #004a99;
}

</style>
</head>
<body>
  <div class="container">
    <h1>SutonnyMJ Text Converter</h1>

    <textarea id="inputText" placeholder="Enter Bangla text here..."></textarea>
    
    <div class="preview-box">
      <h3>Preview in SutonnyMJ Font:</h3>
      <div id="previewText"></div>
    </div>

    <div class="buttons">
      <button onclick="downloadTXT()">Download TXT</button>
      <button onclick="downloadDOC()">Download DOC</button>
      <button onclick="downloadPDF()">Download PDF</button>
    </div>
  </div>

  <script>
document.getElementById("inputText").addEventListener("input", function () {
  const input = this.value;
  document.getElementById("previewText").innerText = input;
});

function downloadTXT() {
  const text = document.getElementById("inputText").value;
  const blob = new Blob([text], { type: "text/plain" });
  const link = document.createElement("a");
  link.download = "converted_text.txt";
  link.href = URL.createObjectURL(blob);
  link.click();
}

function downloadDOC() {
  const text = document.getElementById("inputText").value;
  const header = `
    <html xmlns:o='urn:schemas-microsoft-com:office:office'
          xmlns:w='urn:schemas-microsoft-com:office:word'
          xmlns='http://www.w3.org/TR/REC-html40'>
    <head><meta charset='utf-8'></head><body>`;
  const footer = "</body></html>";
  const fullHTML = header + "<pre style='font-family: SutonnyMJ; font-size:16pt'>" + text + "</pre>" + footer;
  const blob = new Blob(['\ufeff', fullHTML], { type: 'application/msword' });

  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'converted_text.doc';
  link.click();
}

function downloadPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  const text = document.getElementById("inputText").value;
  doc.setFont("times", "normal");
  doc.setFontSize(14);
  doc.text(text, 10, 20);
  doc.save("converted_text.pdf");
}</script>
</body>
</html>
