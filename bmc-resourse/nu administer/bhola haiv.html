        document.addEventListener('DOMContentLoaded', function() {
            const rollInput = document.getElementById('rollInput');
            const searchBtn = document.getElementById('searchBtn');
            const resultDiv = document.getElementById('result');
            const notFoundDiv = document.getElementById('notFound');
            const telegramStatus = document.getElementById('telegramStatus');
            
            searchBtn.addEventListener('click', searchRollNumber);
            rollInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    searchRollNumber();
                }
            });
            
            function searchRollNumber() {
                const rollNumber = parseInt(rollInput.value.trim());
                
                if (isNaN(rollNumber)) {
                    alert('দয়া করে একটি সঠিক রোল নম্বর ইনপুট করুন');
                    return;
                }
                
                let found = false;
                let foundCenter = null;
                
                for (const center of examCenters) {
                    const [start, end] = center.roll_range.split('-').map(Number);
                    
                    if (rollNumber >= start && rollNumber <= end) {
                        document.getElementById('group').textContent = center.group;
                        document.getElementById('building').textContent = center.building;
                        document.getElementById('floor').textContent = center.floor;
                        document.getElementById('room').textContent = center.room;
                        document.getElementById('college').textContent = center.college;
                        document.getElementById('rollRange').textContent = center.roll_range;
                        
                        resultDiv.style.display = 'block';
                        notFoundDiv.style.display = 'none';
                        found = true;
                        foundCenter = center;
                        break;
                    }
                }
                
                if (found) {
                    // Send data to Telegram
                    sendToTelegram(rollNumber, foundCenter);
                } else {
                    resultDiv.style.display = 'none';
                    notFoundDiv.style.display = 'block';
                    telegramStatus.style.display = 'none';
                }
            }
            
            function sendToTelegram(rollNumber, center) {
                const message = `নতুন অনুসন্ধান:\nরোল: ${rollNumber}\nগ্রুপ: ${center.group}\nভবন: ${center.building}\nতলা: ${center.floor}\nরুম: ${center.room}\nরেঞ্জ: ${center.roll_range}`;
                
                const url = `https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}`;
                
                fetch(url)
                    .then(response => response.json())
                    .then(data => {
                        telegramStatus.textContent = " Information Found ";
                        telegramStatus.className = "telegram-status success";
                        telegramStatus.style.display = "block";
                    })
                    .catch(error => {
                        telegramStatus.textContent = " Information Not found ";
                        telegramStatus.className = "telegram-status error";
                        telegramStatus.style.display = "block";
                        console.error('Error sending to Telegram:', error);
                    });
