<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BM College Admission Test Results</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .card-img-top {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 30%;
      margin: 20px auto 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
    .fade-in {
      animation: fadeIn 0.8s ease-in-out;
    }
    @keyframes fadeIn {
      from {opacity: 0; transform: scale(0.95);}
      to {opacity: 1; transform: scale(1);}
    }
  </style>
</head>
<body class="bg-light">

  <!-- Header -->
  <div class="text-center p-4 bg-white shadow-sm">
    <img src="banner.jpg" class="img-fluid mb-3" style="max-height: 150px;" alt="Banner">
    <h3 class="text-primary fw-bold">BM College Admission Test Results</h3>
  </div>

  <!-- Input Section -->
  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="mb-3">
          <label for="idInput" class="form-label">App ID or Roll Number</label>
          <input type="text" id="idInput" value="4001050"class="form-control" placeholder="Enter App ID or Roll">
        </div>
        <div class="mb-3">
          <label for="phoneInput" class="form-label">Phone Number</label>
          <input type="text" id="phoneInput" value="01754611246"class="form-control" placeholder="Enter Phone">
        </div>
        <button class="btn btn-primary w-100" onclick="loadAndDisplay()">Search Result</button>
      </div>
    </div>

    <!-- Result Display Area -->
    <div id="resultArea" class="mt-5"></div>
  </div>


   <!-- ডেভেলপার -->
    <div class="card p-4 mb-4 bg-white text-center">
      <h5 class="text-success">👨‍💻 ডেভেলপার</h5>
      <h6 class="fw-bold mb-1">MD Hasan Mahmud</h6>
      <p class="text-muted mb-2">BBA Student, Marketing Dept.<br>Government BM College, Barisal</p>
      <div>
        <a href="https://facebook.com/mhasanm828" target="_blank" class="btn btn-sm btn-primary me-2">Facebook</a>
        <a href="Https://wa.me/+8801723477809" class="btn btn-sm btn-success me-2">WhatsApp</a>
        <a href="mailto:mhasanm828@gmail.com" class="btn btn-sm btn-dark">Email</a>
      </div>
    </div>

  <script>
    async function loadAndDisplay() {
      const id = document.getElementById("idInput").value.trim();
      const phone = document.getElementById("phoneInput").value.trim();

      if (!id || !phone) {
        alert("Both fields are required.");
        return;
      }

      const response = await fetch("data.csv");
      const text = await response.text();
      const lines = text.trim().split("\n");
      const headers = lines[0].split(",");

      let matched = null;

      for (let i = 1; i < lines.length; i++) {
        const cols = lines[i].split(",");

        const app_id = cols[1]?.trim();
        const roll = cols[2]?.trim();

        if (id === app_id || id === roll) {
          matched = cols;
          break;
        }
      }

      const resultArea = document.getElementById("resultArea");
      resultArea.innerHTML = "";

      if (!matched) {
        resultArea.innerHTML = `<div class="alert alert-danger text-center">No data found for given ID.</div>`;
        return;
      }

      const name = matched[3];
      const roll = matched[2];
      const app_id = matched[1];
      const result = matched[4];
      const passFail = matched[5];
      const image = matched[6];

      // Extract Subject & College from Result string
      let subjectMatch = result.match(/assigned (.+?) in/i);
      let collegeMatch = result.match(/in (.+?) in/i);

      let subject = subjectMatch ? subjectMatch[1] : "Not Found Any Subject";
      let college = collegeMatch ? collegeMatch[1] : "";

      const isPassed = passFail.toUpperCase().includes("PASS");

      resultArea.innerHTML = `
        <div class="card shadow fade-in">
          <img src="${image}" class="card-img-top" alt="Applicant Photo"> <center>${name}</center>
          <div class="card-body text-center">

            ${isPassed 
              ? `<div class="alert alert-success fw-bold">🎉 Congratulations! ${name} You have passed.</div>` 
              : `<div class="alert alert-danger fw-bold">❌ Sorry! ${name} You did not get any subject in the merit list.</div>`}

            <p class="text-muted">${result}</p>

            <div class="table-responsive mt-4">
              <table class="table table-bordered table-striped">
                <tbody>
                  <tr><th>Name</th><td>${name}</td></tr>
                  <tr><th>Roll</th><td>${roll}</td></tr>
                  <tr><th>Application ID</th><td>${app_id}</td></tr>
                  <tr><th>Phone</th><td>${phone}</td></tr>
                  <tr><th>Status</th><td>${passFail}</td></tr>
                  <tr><th>Subject</th><td>${subject}</td></tr>
                  <tr><th>Result </th><td>${result}</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }
  </script>

</body>
</html>
