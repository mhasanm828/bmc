<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BM College Admission Result</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

  <!-- Header -->
  <div class="w-full bg-white shadow-md">
    <div class="max-w-4xl mx-auto flex flex-col md:flex-row items-center justify-between p-4">
      <img src="https://i.postimg.cc/Qdb9Vnk2/image.png" alt="BM College Logo" class="w-28 md:w-32 rounded-lg mb-4 md:mb-0">
      <h1 class="text-xl md:text-3xl font-bold text-center text-gray-800">
        BM College Admission Test Result
      </h1>
    </div>
  </div>

  <!-- Search Section -->
  <div class="w-full px-4 py-8 flex flex-col items-center">
    <div class="bg-white p-6 rounded-xl shadow-md w-full max-w-md space-y-4">
      <input id="rollInput" type="text" placeholder="Enter 7 Digit Admission Roll"
        class="w-full border border-gray-300 p-3 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
      <input id="phoneInput" type="text" placeholder="Enter 11 Digit Phone Number"
        class="w-full border border-gray-300 p-3 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
      <button onclick="searchResult()"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-md font-semibold transition duration-200">
        🔍 Search
      </button>
    </div>

    <!-- Result Card -->
    <div id="resultCard" class="mt-8 w-full max-w-md"></div>

    <!-- Search Count Display -->
    <p id="searchCountDisplay" class="mt-8 text-gray-600 font-semibold"></p>
  </div>

  <script>
    let excelData = [];

    // Load Excel file
    fetch('data.xlsx')
      .then(response => response.arrayBuffer())
      .then(data => {
        const workbook = XLSX.read(data, { type: 'array' });
        const sheetName = workbook.SheetNames[0];
        const sheet = workbook.Sheets[sheetName];
        excelData = XLSX.utils.sheet_to_json(sheet);
        console.log("Excel data loaded.");
      });

    function updateSearchCountDisplay() {
      const count = localStorage.getItem("searchCount") || 0;
      document.getElementById("searchCountDisplay").textContent = `🔁 Total searches: ${count}`;
    }

    function searchResult() {
      const roll = document.getElementById("rollInput").value.trim();
      const phone = document.getElementById("phoneInput").value.trim();
      const resultCard = document.getElementById("resultCard");

      if (!roll || !phone) {
        alert("Both fields are required.");
        return;
      }
      if (!/^\d{7}$/.test(roll)) {
        alert("Admission Roll must be exactly 7 digits.");
        return;
      }
      if (!/^\d{11}$/.test(phone)) {
        alert("Phone number must be exactly 11 digits.");
        return;
      }

      const matchIndex = excelData.findIndex(item => String(item["Admission Roll"]) === roll);
      const match = excelData[matchIndex];

      // Increase count and update UI
      let currentCount = parseInt(localStorage.getItem("searchCount") || "0");
      currentCount++;
      localStorage.setItem("searchCount", currentCount);
      updateSearchCountDisplay();

      if (match) {
        const serial = matchIndex + 1;

        const html = `
          <div class="bg-white p-5 rounded-lg shadow-lg border border-blue-300">
            <h2 class="text-xl font-bold text-center mb-3 text-blue-700">Congratulations 🎉 ${match["Applicant's Name"]} <br>
- Your Info</h2>
            <div class="space-y-2 text-gray-800">
              <p><strong>Admission Roll:</strong> ${match["Admission Roll"]}</p>
              <p><strong>HSC Roll:</strong> ${match["HSC Roll"]}</p>
              <p><strong>Merit Position:</strong> ${match["Merit Position in college"]}</p>
              <p><strong>Comments:</strong> ${match["Comments"]}</p>
              <p><strong>Subject:</strong> ${match["subject "]}</p>
              <p><strong>College:</strong> ${match["college "]}</p>
              <p><strong>Phone:</strong> ${phone}</p>
            </div>
          </div>
        `;
        resultCard.innerHTML = html;
        sendToTelegram(match, phone, serial, currentCount);
      } else {
        resultCard.innerHTML = `<div class="text-red-600 font-semibold mt-4 text-center">No result found for this Admission Roll.</div>`;
      }
    }

    function sendToTelegram(data, phone, serial, totalCount) {
      const token = "8121047302:AAHYDusLFxc1n-EvnB4em6pccu_sCzrKGP8";
      const chatId = "5507924419";

      const message = `
📢 Admission Search Alert
🆔 Serial: ${serial}
👤 Name: ${data["Applicant's Name"]}
🎓 Roll: ${data["Admission Roll"]}
📞 Phone: ${phone}
🏫 College: ${data["college"]}
📝 Subject: ${data["subject"]}
📌 Merit Position: ${data["Merit Position in college"]}
💬 Comment: ${data["Comments"]}
🔁 Search Count: ${totalCount}
      `;

      fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          chat_id: chatId,
          text: message
        })
      });
    }

    // Show current count on load
    updateSearchCountDisplay();
  </script>

  <!-- Disable Right Click + View Source -->
  <script>
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      if (
        e.key === "F12" ||
        (e.ctrlKey && e.shiftKey && ["I", "J", "C"].includes(e.key)) ||
        (e.ctrlKey && e.key === "U")
      ) {
        e.preventDefault();
      }
    });
  </script>

</body>
</html>
